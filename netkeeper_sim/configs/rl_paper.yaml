training:
  episodes: 10
  max_steps: 200
  replay_buffer_size: 100
  batch_size: 16
  gamma: 0.85
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.99
  target_update_interval: 16
  target_update_tau: null
  actor_lr: 0.0001
  critic_lr: 0.0002
  gradient_clip_norm: 1.0
  loss: huber
  reward_normalization: false
  deterministic_seed: 42
  device: auto
  hidden_dim: 128
  gcn_layers: 8
  transformer_layers: 8
  transformer_heads: 8
  decoder_linear_layers: 4
