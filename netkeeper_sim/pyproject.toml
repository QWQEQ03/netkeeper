[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netkeeper-sim"
version = "0.1.0"
description = "Lightweight network simulation kernel for reproducing NetKeeper concepts."
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
rl = [
    "torch>=2.2",
    "torch-geometric>=2.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netkeeper_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
